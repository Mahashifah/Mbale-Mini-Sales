<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbale Mini Sales - Phones, Houses, Plots</title>
<style>
body{margin:0;background:#f5f5f5;font-family:sans-serif}
.header{background:#0a8a0a;color:white;text-align:center;padding:20px 10px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:10px;padding:10px;text-align:center;box-shadow:0 2px 5px #0002}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.price{color:green;font-weight:bold;font-size:14px}.btn{background:#25D366;color:white;padding:8px 12px;border-radius:20px;display:inline-block;margin-top:5px;text-decoration:none;font-size:13px}
.cat-btn{padding:6px 12px;margin:3px;border:1px solid green;border-radius:20px;background:white}.cat-btn.active{background:green;color:white}
.whatsapp-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:bold;box-shadow:0 3px 10px #0003;z-index:99}
</style>
</head>
<body>
<div class="header">
<img src="IMG-20261008-WA4035.jpg" style="width:90px;background:white;border-radius:14px;padding:8px;">
<h1 style="margin:5px 0">Mbale Mini Sales</h1>
<p>Buy & Sell Fast in Mbale - Phones, Houses, Plots</p>
<input type="text" id="searchInput" placeholder="Search... House, Plot, Tecno" onkeyup="searchProducts()" style="width:90%;padding:10px;border-radius:20px;border:none;margin-top:10px">
</div>
<div style="text-align:center;padding:10px;overflow-x:auto;white-space:nowrap">
<button class="cat-btn active" onclick="filterCat('all')">All</button>
<button class="cat-btn" onclick="filterCat('phones')">Phones</button>
<button class="cat-btn" onclick="filterCat('shoes')">Shoes</button>
<button class="cat-btn" onclick="filterCat('clothes')">Clothes</button>
<button class="cat-btn" onclick="filterCat('bags')">Bags</button>
<button class="cat-btn" onclick="filterCat('houses')">Houses</button>
<button class="cat-btn" onclick="filterCat('plots')">Plots/Land</button>
</div>
<div id="products" class="products"><p style="text-align:center;width:100%">Loading...</p></div>
<a href="https://wa.me/256795336227" class="whatsapp-float">WhatsApp Us</a>
<footer style="text-align:center;padding:20px;background:#333;color:white;margin-top:20px"><p>Mbale Mini Sales © 2026 | 0795336227</p><p><a href="admin.html" style="color:#aaa">Admin Login</a></p></footer>
<script>
const API="https://api.npoint.io/31c6242fbd3f940c951b";
let allItems=[];
fetch(API).then(r=>r.json()).then(data=>{allItems=data;showProducts(data);}).catch(e=>{document.getElementById('products').innerHTML='Error loading - check npoint link';});
function showProducts(list){
const div=document.getElementById('products');div.innerHTML="";
if(list.length==0){div.innerHTML="<p>No products yet</p>";return;}
list.forEach(p=>{div.innerHTML+=`<div class="card"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/400'"><h3 style="font-size:13px">${p.name}</h3><p class="price">${p.price}</p><a href="https://wa.me/256795336227?text=Hi,%20I%20want%20${encodeURIComponent(p.name)}%20-%20${p.price}" class="btn">Order on WhatsApp</a></div>`});
}
function filterCat(c){
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');
if(c=='all') showProducts(allItems); else showProducts(allItems.filter(i=>i.cat==c));
}
function searchProducts(){
let q=document.getElementById('searchInput').value.toLowerCase();
showProducts(allItems.filter(i=>i.name.toLowerCase().includes(q) || i.cat.includes(q)));
}
</script>
</body>
</html>
