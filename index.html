<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbale Mini Sales - Buy & Sell Fast</title>
<style>
body{margin:0;background:#f5f5f5;font-family:sans-serif}
.header{background:#0a8a0a;color:white;text-align:center;padding:15px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:10px;padding:10px;text-align:center;box-shadow:0 2px 5px #0002}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.price{color:green;font-weight:bold}.btn{background:#25D366;color:white;padding:8px 12px;border-radius:20px;display:inline-block;margin-top:5px;text-decoration:none;font-size:13px;border:none;cursor:pointer}
.topbar{background:#003300;color:white;display:flex;justify-content:space-between;padding:8px 12px;align-items:center;font-size:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;z-index:99;justify-content:center;align-items:center}
.modal-content{background:white;padding:20px;border-radius:12px;width:90%;max-width:350px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.cat-btn{padding:6px 12px;margin:3px;border:1px solid green;border-radius:20px;background:white;cursor:pointer}.cat-btn.active{background:green;color:white}
.cat-wrap{display:flex;flex-wrap:wrap;justify-content:center;padding:8px}
</style></head><body>
<div class="topbar"><span>Mbale Mini Sales</span><div><span id="userInfo"></span> <button onclick="openAuth()" style="background:white;color:green;border:none;padding:5px 12px;border-radius:15px;font-weight:bold" id="loginBtn">Login / Register</button><button onclick="logout()" id="logoutBtn" style="display:none;background:red;color:white;border:none;padding:5px 10px;border-radius:15px">Logout</button></div></div>
<div class="header"><img src="logo.jpg" style="width:80px;background:white;border-radius:10px;padding:5px" onerror="this.style.display='none'"><h2 style="margin:5px">Buy & Sell Fast in Mbale</h2><input id="searchInput" placeholder="Search plots, cars, phones..." onkeyup="searchProducts()" style="width:90%;padding:10px;border-radius:20px;border:none"></div>
<div class="cat-wrap">
<button class="cat-btn active" onclick="filterCat('all')">All</button>
<button class="cat-btn" onclick="filterCat('phones')">Phones</button>
<button class="cat-btn" onclick="filterCat('gadgets')">Gadgets</button>
<button class="cat-btn" onclick="filterCat('electricals')">Electricals</button>
<button class="cat-btn" onclick="filterCat('houses')">Houses</button>
<button class="cat-btn" onclick="filterCat('plots')">Plots</button>
<button class="cat-btn" onclick="filterCat('rentals')">Rentals</button>
<button class="cat-btn" onclick="filterCat('cars')">Cars</button>
<button class="cat-btn" onclick="filterCat('motorcycles')">Motorcycles</button>
<button class="cat-btn" onclick="filterCat('shoes')">Shoes</button>
<button class="cat-btn" onclick="filterCat('clothes')">Clothes</button>
<button class="cat-btn" onclick="filterCat('bags')">Bags</button>
<button class="cat-btn" onclick="filterCat('advertising')">Advertising</button>
</div>
<div id="products" class="products">Loading...</div>
<div class="modal" id="authModal"><div class="modal-content">
<h3 id="authTitle">Create Account</h3>
<input id="authName" placeholder="Your Name (for Register)">
<input id="authPhone" placeholder="Phone: 0795336227">
<input id="authPass" type="password" placeholder="Password">
<button onclick="doAuth()" style="width:100%;padding:10px;background:green;color:white;border:none;border-radius:8px;margin-top:8px" id="authActionBtn">Register / Login</button>
<p style="font-size:12px;text-align:center;margin-top:8px"><a href="#" onclick="toggleAuthMode()">Have account? Login / No account? Register</a></p>
<p id="authMsg" style="color:red;font-size:13px"></p>
<button onclick="closeAuth()" style="width:100%;background:#ccc;margin-top:5px;padding:8px;border:none;border-radius:8px">Close</button>
</div></div>
<footer style="text-align:center;padding:15px;background:#333;color:white"><p>0795336227 | 0743788078</p><a href="admin.html" style="color:#aaa">Admin Panel</a></footer>
<script>
const API="https://api.npoint.io/31c6242fbd3f940c951b";
let products=[], users=[], mode='register', currentUser=JSON.parse(localStorage.getItem('mbaleUser')||'null');
function updateUI(){if(currentUser){document.getElementById('userInfo').innerText='Hi, '+currentUser.name;document.getElementById('loginBtn').style.display='none';document.getElementById('logoutBtn').style.display='inline';}else{document.getElementById('userInfo').innerText='';document.getElementById('loginBtn').style.display='inline';document.getElementById('logoutBtn').style.display='none';}}
updateUI();
async function loadData(){
let r=await fetch(API);let data=await r.json();
if(Array.isArray(data)){products=data;users=[];}else{products=data.products||[];users=data.users||[];}
showProducts(products);
}
function showProducts(list){let d=document.getElementById('products');d.innerHTML='';if(!list.length){d.innerHTML='<p>No products</p>';return;}list.forEach(p=>{d.innerHTML+=`<div class=card><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'"><h3 style=font-size:13px>${p.name}</h3><p class=price>${p.price}</p><p style=font-size:11px;color:#666>${p.cat}</p><button class=btn onclick="orderProduct('${p.name.replace(/'/g,"")}','${p.price}')">Order on WhatsApp</button></div>`});}
function orderProduct(name,price){if(!currentUser){alert('Please Login / Register first with phone number!');openAuth();return;}let msg=`Hi, I am ${currentUser.name} (${currentUser.phone}). I want ${name} - ${price}. From Mbale Mini Sales website`;window.open(`https://wa.me/256795336227?text=${encodeURIComponent(msg)}`,'_blank');}
function openAuth(){document.getElementById('authModal').style.display='flex';}function closeAuth(){document.getElementById('authModal').style.display='none';}
function toggleAuthMode(){mode=mode==='register'?'login':'register';document.getElementById('authTitle').innerText=mode==='register'?'Create Account':'Login';document.getElementById('authName').style.display=mode==='register'?'block':'none';}
async function doAuth(){
let name=document.getElementById('authName').value.trim(),phone=document.getElementById('authPhone').value.trim(),pass=document.getElementById('authPass').value.trim();
if(!phone||!pass){document.getElementById('authMsg').innerText='Enter phone and password';return;}
if(mode==='register'){if(!name){document.getElementById('authMsg').innerText='Enter your name';return;}if(users.find(u=>u.phone===phone)){document.getElementById('authMsg').innerText='Phone already registered, please Login';mode='login';document.getElementById('authTitle').innerText='Login';return;}
users.push({name,phone,password:pass});await saveData();currentUser={name,phone};localStorage.setItem('mbaleUser',JSON.stringify(currentUser));document.getElementById('authMsg').innerText='Account created!';updateUI();closeAuth();}
else{let u=users.find(u=>u.phone===phone&&u.password===pass);if(!u){document.getElementById('authMsg').innerText='Wrong phone or password';return;}currentUser={name:u.name,phone:u.phone};localStorage.setItem('mbaleUser',JSON.stringify(currentUser));updateUI();closeAuth();}
}
async function saveData(){await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products,users})});}
function logout(){localStorage.removeItem('mbaleUser');currentUser=null;updateUI();}
function filterCat(c){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');if(c==='all')showProducts(products);else showProducts(products.filter(i=>i.cat===c));}
function searchProducts(){let q=document.getElementById('searchInput').value.toLowerCase();showProducts(products.filter(i=>i.name.toLowerCase().includes(q)));}
loadData();
</script></body></html>
