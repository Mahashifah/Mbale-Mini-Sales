<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbale Mini Sales - Buy & Sell Fast in Mbale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <img src="IMG-20261008-WA4035.jpg" alt="Mbale Mini Sales Logo" style="width:90px;background:white;border-radius:14px;padding:8px;margin-bottom:10px;">
  <h1>Mbale Mini Sales</h1>
  <p>Buy & Sell Fast in Mbale - Phones, Shoes, Clothes, Bags</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search products... e.g. Tecno, Nike" onkeyup="searchProducts()">
  </div>
</header>

<div class="container">
  <div class="categories">
    <button class="cat-btn active" onclick="filterCat('all')">All</button>
    <button class="cat-btn" onclick="filterCat('phones')">Phones</button>
    <button class="cat-btn" onclick="filterCat('shoes')">Shoes</button>
    <button class="cat-btn" onclick="filterCat('clothes')">Clothes</button>
    <button class="cat-btn" onclick="filterCat('bags')">Bags</button>
  </div>

  <div id="products" class="products"></div>
</div>

<a href="https://wa.me/256795336227" class="whatsapp-float">WhatsApp Us</a>

<footer>
  <p>Mbale Mini Sales © 2026 | 90+ followers on WhatsApp Channel</p>
  <p>Contact: 0795336227 | Mbale City, Uganda</p>
</footer>

<script>
const items = [
  {name:"Tecno Spark 10 Pro",price:"450,000 UGX",cat:"phones",img:"https://images.unsplash.com/photo-1592899677977-9bb10ba128a5?w=400"},
  {name:"Infinix Hot 30",price:"380,000 UGX",cat:"phones",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
  {name:"Nike Air Max",price:"120,000 UGX",cat:"shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
  {name:"Adidas Sneakers",price:"95,000 UGX",cat:"shoes",img:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400"},
  {name:"Men's T-Shirt",price:"25,000 UGX",cat:"clothes",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
  {name:"Ladies Handbag",price:"65,000 UGX",cat:"bags",img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
  {name:"Samsung A14",price:"520,000 UGX",cat:"phones",img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400"},
  {name:"School Bag",price:"45,000 UGX",cat:"bags",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"}
];

function showProducts(list){
  const div = document.getElementById('products');
  div.innerHTML = "";
  list.forEach(p=>{
    div.innerHTML += `<div class="card" data-cat="${p.cat}">
      <img src="${p.img}"><h3>${p.name}</h3><p class="price">${p.price}</p>
      <a href="https://wa.me/256795336227?text=Hi%20Mbale%20Mini%20Sales,%20I%20want%20${encodeURIComponent(p.name)}" class="btn">Order on WhatsApp</a></div>`;
  });
}
function filterCat(c){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(c=='all') showProducts(items); else showProducts(items.filter(i=>i.cat==c));
}
function searchProducts(){
  let q = document.getElementById('searchInput').value.toLowerCase();
  showProducts(items.filter(i=>i.name.toLowerCase().includes(q)));
}
showProducts(items);
</script>
</body>
</html>
