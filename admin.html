<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Global - Mbale</title>
<style>body{font-family:sans-serif;padding:15px;background:#f0f0f0}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{width:100%;padding:12px;background:green;color:white;border:none;border-radius:8px;margin-top:8px;font-weight:bold}button:disabled{background:gray}.item{background:white;padding:10px;margin:8px 0;border-radius:8px;display:flex;gap:10px;align-items:center}.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}</style></head><body>
<h2>Mbale Mini Sales - GLOBAL Admin</h2>
<p style="color:green">✓ Connected to online database - changes show to ALL customers instantly!</p>
<input id="name" placeholder="Name: e.g. 3 Bedroom House in Maluku - Title Ready">
<input id="price" placeholder="Price: e.g. 120M UGX or 450,000 UGX">
<select id="cat"><option value="houses">Houses</option><option value="plots">Plots/Land</option><option value="phones">Phones</option><option value="shoes">Shoes</option><option value="clothes">Clothes</option><option value="bags">Bags</option></select>
<input id="img" placeholder="Image link (from imgbb.com) - or upload below">
<input type="file" id="file" accept="image/*"><img id="preview" style="width:100%;max-height:200px;display:none;border-radius:10px;margin-top:5px">
<button id="addBtn" onclick="addProduct()">Add Product - LIVE to All</button>
<p id="status"></p>
<h3>Current Live Products (from database):</h3><div id="list">Loading...</div>
<a href="index.html">View Website</a>
<script>
const API="https://api.npoint.io/31c6242fbd3f940c951b";
let items=[];let tempImg="";
document.getElementById('file').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>{tempImg=ev.target.result;document.getElementById('preview').src=tempImg;document.getElementById('preview').style.display='block';};r.readAsDataURL(e.target.files[0]);});
async function load(){try{let res=await fetch(API);items=await res.json();render();}catch(e){document.getElementById('list').innerHTML='Failed to load';}}
function render(){let l=document.getElementById('list');l.innerHTML="";items.forEach((p,i)=>{l.innerHTML+=`<div class=item><img src="${p.img}"><div style=flex:1><b>${p.name}</b><br>${p.price} - ${p.cat}</div><button onclick="removeItem(${i})" style="width:auto;background:red;padding:5px 10px">Delete</button></div>`});}
async function saveToCloud(){
document.getElementById('status').innerText='Saving to cloud... Please wait';
document.getElementById('addBtn').disabled=true;
try{
let res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(items)});
if(res.ok){document.getElementById('status').innerText='✓ Saved! Everyone can see now!';}
else{document.getElementById('status').innerText='Error saving - try again';}
}catch(e){document.getElementById('status').innerText='Network error - check data';}
document.getElementById('addBtn').disabled=false;
}
async function addProduct(){
let n=document.getElementById('name').value.trim(), pr=document.getElementById('price').value.trim(), c=document.getElementById('cat').value, imgLink=document.getElementById('img').value.trim();
let finalImg=tempImg||imgLink;if(!finalImg){alert('Add image - upload file OR paste link from imgbb.com');return;}
if(!n||!pr){alert('Enter name and price');return;}
items.unshift({name:n,price:pr,cat:c,img:finalImg});
await saveToCloud();render();
document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';tempImg='';document.getElementById('preview').style.display='none';
}
async function removeItem(i){if(!confirm('Delete this product from LIVE website?')) return;items.splice(i,1);await saveToCloud();render();}
load();
</script></body></html>
