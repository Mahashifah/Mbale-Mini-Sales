<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Mbale Mini Sales</title>
<style>body{font-family:sans-serif;padding:15px;background:#f0f0f0}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{width:100%;padding:12px;background:green;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold}.item{background:white;padding:10px;margin:8px 0;border-radius:8px;display:flex;gap:10px;align-items:center}.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}</style></head><body>
<h2>Mbale Mini Sales - Admin</h2><p>Add / Remove Products (Houses, Plots, Phones...)</p>
<input id="name" placeholder="Product Name: e.g. 2 Bedroom House in Namatala">
<input id="price" placeholder="Price: e.g. 85M UGX or 450,000 UGX">
<select id="cat"><option value="phones">Phones</option><option value="shoes">Shoes</option><option value="clothes">Clothes</option><option value="bags">Bags</option><option value="houses">Houses</option><option value="plots">Plots/Land</option></select>
<input id="img" placeholder="Paste Image Link OR upload below">
<input type="file" id="file" accept="image/*">
<img id="preview" style="width:100%;max-height:200px;display:none;border-radius:10px;margin-top:5px">
<button onclick="addProduct()">Add Product</button>
<button onclick="clearAll()" style="background:red">Clear All Products</button>
<h3>Current Products:</h3><div id="list"></div>
<a href="index.html">Back to Website</a>
<script>
let items=JSON.parse(localStorage.getItem('mbale_products')||'null')||[];
let tempImg="";
document.getElementById('file').addEventListener('change',function(e){
let reader=new FileReader();reader.onload=function(ev){tempImg=ev.target.result;document.getElementById('preview').src=tempImg;document.getElementById('preview').style.display='block';};reader.readAsDataURL(e.target.files[0]);
});
function render(){let l=document.getElementById('list');l.innerHTML="";items.forEach((p,i)=>{l.innerHTML+=`<div class=item><img src="${p.img}"><div style=flex:1><b>${p.name}</b><br>${p.price} - ${p.cat}</div><button onclick="removeItem(${i})" style="width:auto;background:red;padding:5px 10px">X</button></div>`});}
function addProduct(){
let n=document.getElementById('name').value, pr=document.getElementById('price').value, c=document.getElementById('cat').value, imgLink=document.getElementById('img').value;
let finalImg=tempImg||imgLink||'https://via.placeholder.com/400';
if(!n||!pr){alert('Enter name and price');return;}
items.unshift({name:n,price:pr,cat:c,img:finalImg});localStorage.setItem('mbale_products',JSON.stringify(items));
document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';tempImg='';document.getElementById('preview').style.display='none';render();alert('Added! Now open homepage - it will show.');
}
function removeItem(i){if(confirm('Delete this?')){items.splice(i,1);localStorage.setItem('mbale_products',JSON.stringify(items));render();}}
function clearAll(){if(confirm('Delete ALL?')){localStorage.removeItem('mbale_products');items=[];render();}}
render();
</script></body></html>
