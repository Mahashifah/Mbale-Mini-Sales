<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Mbale Global</title><style>body{font-family:sans-serif;padding:12px;background:#eee}input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}button{padding:10px;background:green;color:white;border:none;border-radius:8px;margin-top:5px;width:100%}.item{background:white;padding:8px;margin:6px 0;border-radius:8px;display:flex;gap:8px;align-items:center}</style></head><body>
<h3>Mbale Mini Sales - Admin Global</h3>
<input id="name" placeholder="Product Name"><input id="price" placeholder="Price"><select id="cat"><option value="houses">Houses</option><option value="plots">Plots</option><option value="phones">Phones</option><option value="shoes">Shoes</option><option value="clothes">Clothes</option><option value="bags">Bags</option></select>
<input id="img" placeholder="Image link (imgbb.com)"><input type="file" id="file" accept="image/*"><button onclick="addProduct()">Add Product LIVE</button>
<p id="status"></p>
<h4>Live Products</h4><div id="list"></div>
<h4>Registered Customers (Phone Accounts)</h4><div id="usersList"></div>
<a href="index.html">View Site</a>
<script>
const API="https://api.npoint.io/31c6242fbd3f940c951b";let products=[],users=[],tempImg="";
document.getElementById('file').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tempImg=ev.target.result;r.readAsDataURL(e.target.files[0]);});
async function load(){let res=await fetch(API);let data=await res.json();if(Array.isArray(data)){products=data;users=[];}else{products=data.products||[];users=data.users||[];}render();}
function render(){document.getElementById('list').innerHTML=products.map((p,i)=>`<div class=item><img src="${p.img}" style=width:50px;height:50px;object-fit:cover><div style=flex:1>${p.name}<br>${p.price}</div><button onclick="del(${i})" style=width:auto;background:red>Del</button></div>`).join('');document.getElementById('usersList').innerHTML=users.length?users.map(u=>`<div class=item>👤 ${u.name} - ${u.phone}</div>`).join(''):'<p>No users yet</p>';}
async function save(){document.getElementById('status').innerText='Saving...';await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products,users})});document.getElementById('status').innerText='Saved!';}
async function addProduct(){let n=document.getElementById('name').value,pr=document.getElementById('price').value,c=document.getElementById('cat').value,imgL=document.getElementById('img').value;let f=tempImg||imgL;if(!n||!pr||!f){alert('Fill all');return;}products.unshift({name:n,price:pr,cat:c,img:f});await save();render();}
async function del(i){if(!confirm('Delete?'))return;products.splice(i,1);await save();render();}
load();
</script></body></html>
