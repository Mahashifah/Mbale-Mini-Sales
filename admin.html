<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin FIXED</title><style>body{font-family:sans-serif;padding:12px;background:#eee}input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{padding:10px;background:green;color:white;border:none;border-radius:8px;margin-top:5px;width:100%;cursor:pointer}.item{background:white;padding:8px;margin:6px 0;border-radius:8px;display:flex;gap:8px;align-items:center}</style></head><body>
<h3>Mbale Mini Sales - Admin COMPRESSED</h3>
<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price e.g. 500k UGX">
<select id="cat"><option value="phones">Phones</option><option value="gadgets">Gadgets</option><option value="electricals">Electricals</option><option value="houses">Houses</option><option value="plots">Plots</option><option value="rentals">Rentals</option><option value="cars">Cars</option><option value="motorcycles">Motorcycles</option><option value="shoes">Shoes</option><option value="clothes">Clothes</option><option value="bags">Bags</option><option value="advertising">Advertising</option><option value="others">Others</option></select>
<select id="cond"><option value="Brand New">✅ Brand New</option><option value="Slightly Used">♻️ Slightly Used</option></select>
<textarea id="desc" placeholder="Description..." rows="4" style="border:2px solid green"></textarea>
<input id="img" placeholder="Image link - optional, BEST METHOD">
<input type="file" id="file" accept="image/*">
<button onclick="addProduct()">Add Product LIVE</button>
<p id="status"></p>
<h4>Live (<span id="count">0</span>)</h4><div id="list"></div>
<script>
const API="https://api.npoint.io/a3c7715c362f130b7d58";let products=[],users=[],tempImg="";
document.getElementById('file').addEventListener('change',e=>{
 let file=e.target.files[0];
 let reader=new FileReader();
 reader.onload=ev=>{
  let img=new Image();
  img.onload=()=>{
   let canvas=document.createElement('canvas');
   let max=500;
   let w=img.width, h=img.height;
   if(w>h){if(w>max){h*=max/w;w=max}}else{if(h>max){w*=max/h;h=max}}
   canvas.width=w;canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);
   tempImg=canvas.toDataURL('image/jpeg',0.5);
   document.getElementById('status').innerText='Compressed ready! Size: '+Math.round(tempImg.length/1024)+'KB';
  };
  img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
});
async function load(){let res=await fetch(API);let data=await res.json();products=data.products||[];users=data.users||[];render();}
function render(){document.getElementById('count').innerText=products.length;document.getElementById('list').innerHTML=products.map((p,i)=>`<div class=item><img src="${p.img}" style=width:50px;height:50px;object-fit:cover;border-radius:5px><div style=flex:1><b>${p.name}</b><br><small>${p.price} - ${p.cat}</small></div><button onclick="del(${i})" style=width:auto;background:red>Del</button></div>`).join('');}
async function save(){document.getElementById('status').innerText='Saving...';await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products,users})});document.getElementById('status').innerText='Saved!';}
async function addProduct(){let n=document.getElementById('name').value,pr=document.getElementById('price').value,c=document.getElementById('cat').value,co=document.getElementById('cond').value,de=document.getElementById('desc').value,imgL=document.getElementById('img').value;let f=tempImg||imgL;if(!n||!pr||!f){alert('Fill Name, Price, Image');return;}if(f.length>90000){alert('Image still too big! Use Image Link method instead');return;}products.unshift({name:n,price:pr,cat:c,cond:co,desc:de,img:f});await save();render();document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('desc').value='';tempImg='';}
async function del(i){if(!confirm('Delete?'))return;products.splice(i,1);await save();render();}
load();
</script></body></html>
